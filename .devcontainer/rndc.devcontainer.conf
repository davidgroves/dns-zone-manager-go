# RNDC configuration for the devcontainer.
# Installed as /etc/bind/rndc.conf (Debian bind9utils default) with a
# symlink at /etc/rndc.conf. Connects to BIND in the 'bind' container.

options {
    default-server bind;
    default-port 953;
    default-key "rndc-key";
};

key "rndc-key" {
    algorithm hmac-sha256;
    secret "xT7J2kLpN9qRvW4mY8sF1gH5bC3dE6aZ0iO7uP2wX4c=";
};
