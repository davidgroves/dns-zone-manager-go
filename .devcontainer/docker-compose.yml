# DNS Zone Manager Devcontainer Environment
# Provides a development container, a BIND DNS server, PostgreSQL,
# Grafana LGTM (Loki + Grafana + Tempo + Prometheus), and an optional
# Traefik + oauth2-proxy + Entra-emulator auth front door.
#
# No static IPs/subnet are used. BIND's also-notify directive requires an IP
# address (it does not support hostnames), so the BIND entrypoint resolves the
# "dev" service name to its current IP at runtime and enables NOTIFY via
# `rndc reconfig`. The dev container reaches BIND via the "bind" service name.
#   dev:      receives NOTIFY on port 15354; also publishes Traefik/Entra ports
#   bind:     DNS on 15353, RNDC on 953
#   postgres: scheduled change store on 5432 (also published on host 15432)
#   lgtm:     Grafana on 3000, OTLP on 4317/4318
#   entra / oauth2-proxy / traefik:
#     share the `dev` container's network namespace so the OIDC issuer
#     http://localhost:8444/... is the same URL for the host browser, dns-cli
#     inside the container, and oauth2-proxy. Start them via the ENTRA /
#     TRAEFIK VS Code tasks (not runServices).

services:
  # Development container - VS Code/Cursor connects here
  dev:
    # Prebuilt dev image pulled from GHCR (built by .github/workflows/
    # devcontainer-image.yml). Nothing builds on the user's machine, so clone ->
    # Reopen in Container is a pull, not a build. To change the image, edit
    # .devcontainer/Dockerfile and run `make devcontainer-image` (or push to main
    # / trigger the workflow). See DEVELOPMENT.md.
    image: ghcr.io/davidgroves/dns-zone-manager-devcontainer:latest
    volumes:
      - ..:/workspace:cached
      - /var/run/docker.sock:/var/run/docker.sock  # Access to Docker for viewing logs
      # Shared with BIND for on-demand large zones (perf harness / rndc addzone)
      - perf-zones:/perf-zones
      - managed-zones:/managed-zones
    command: sleep infinity
    environment:
      - TZ=UTC
      # Ship structured logs to Loki via the LGTM OTLP collector
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4318
      - OTEL_SERVICE_NAME=dns-zone-manager
    # Expose ports directly (more reliable than VS Code forwardPorts on macOS).
    # 8080/8081/8444 are bound by Traefik / the Entra emulator when those
    # tasks are running; they share this container's network namespace.
    ports:
      - "8000:8000"   # API and embedded web UI
      - "5173:5173"   # optional Vite dev server (not started by default)
      - "8080:8080"   # Traefik (OIDC front door)
      - "8081:8081"   # Traefik dashboard
      - "8444:8444"   # Entra ID emulator (OIDC issuer)
    # Enable host.docker.internal on Linux (automatic on Docker Desktop)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Allow running commands as root when needed
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    networks:
      - devnet

  # Local Microsoft Entra ID emulator (OIDC issuer for the Traefik front door).
  # Shares the `dev` network namespace so issuer URLs are always localhost:8444.
  # Listens on internal :18445; the ENTRA task runs themeproxy on :8444 to
  # darken the baked-in light sign-in HTML (emulator has no theme flag).
  # PUBLIC_ORIGIN stays :8444 so discovery / redirects match the browser URL.
  # The ENTRA task imports .devcontainer/entra/directory.json after health.
  entra:
    image: ghcr.io/calvinchengx/entra-emulator@sha256:19418a503b6459d1f9db4e0d7657f78bf01655269ce7abef968fd5d1eb80da86
    network_mode: "container:${COMPOSE_PROJECT_NAME:-dns-zone-manager-go_devcontainer}-dev-1"
    environment:
      - TZ=UTC
      - TLS_ENABLED=false
      - PORT=18445
      - HOST=0.0.0.0
      - ORIGIN_MODE=compat
      - PUBLIC_ORIGIN=http://localhost:8444
      - REQUIRE_PASSWORD=true
      # Empty data dir = in-memory store (ephemeral, like BIND/Postgres tmpfs).
      - ENTRA_DATA_DIR=
      - TOKEN_LIFETIME_ACCESS_SECONDS=3600
      - DEVICE_CODE_INTERVAL_SECONDS=5
    restart: unless-stopped

  # oauth2-proxy sits between Traefik and the API. Browser sessions use the
  # authorization-code flow against the Entra emulator; CLI Bearer JWTs are
  # validated via --skip-jwt-bearer-tokens. Identity is forwarded as
  # X-Auth-Request-* headers that the API's proxy_auth trusts.
  #
  # Production: change PROVIDER to entra-id and point OIDC_ISSUER_URL at a
  # real tenant (entra-id additionally asserts the login.microsoftonline.com
  # issuer template, which the emulator cannot satisfy).
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.9.0
    network_mode: "container:${COMPOSE_PROJECT_NAME:-dns-zone-manager-go_devcontainer}-dev-1"
    env_file:
      - entra/dev.env
    environment:
      - TZ=UTC
      - OAUTH2_PROXY_PROVIDER=oidc
      - OAUTH2_PROXY_OIDC_ISSUER_URL=http://localhost:8444/6f89cf12-978b-4d23-ac18-9ef0c127cf87/v2.0
      - OAUTH2_PROXY_CLIENT_ID=c9c2fd4f-4c1e-44a3-9cd5-a1a1191fe9a3
      - OAUTH2_PROXY_CLIENT_SECRET=eZYgMLyK3PnDubc1UXOs8TTh8K1hLE6DMejZFjJfFvc
      - OAUTH2_PROXY_REDIRECT_URL=http://localhost:8080/oauth2/callback
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180
      - OAUTH2_PROXY_UPSTREAMS=static://202
      - OAUTH2_PROXY_EMAIL_DOMAINS=*
      - OAUTH2_PROXY_COOKIE_SECURE=false
      - OAUTH2_PROXY_COOKIE_HTTPONLY=true
      - OAUTH2_PROXY_SET_XAUTHREQUEST=true
      - OAUTH2_PROXY_REVERSE_PROXY=true
      # Show oauth2-proxy's "Sign in with Entra ID" page before redirecting to
      # the IdP. With ForwardAuth pointed at `/` (static://202), an unauthenticated
      # visit returns that HTML (403) instead of bouncing straight to :8444.
      - OAUTH2_PROXY_SKIP_PROVIDER_BUTTON=false
      - OAUTH2_PROXY_PROVIDER_DISPLAY_NAME=Entra ID
      # Dark-themed templates (see .devcontainer/oauth2-proxy/). "-" hides the
      # default light SVG logo which does not suit the dark page.
      - OAUTH2_PROXY_CUSTOM_TEMPLATES_DIR=/templates
      - OAUTH2_PROXY_CUSTOM_SIGN_IN_LOGO=-
      # id_tokens expose preferred_username (UPN); access tokens get it via
      # optionalClaims on the API app. Plain "email" / "upn" are not always present.
      - OAUTH2_PROXY_OIDC_EMAIL_CLAIM=preferred_username
      - OAUTH2_PROXY_OIDC_GROUPS_CLAIM=groups
      - OAUTH2_PROXY_USER_ID_CLAIM=oid
      - OAUTH2_PROXY_SCOPE=openid profile email offline_access
      - OAUTH2_PROXY_WHITELIST_DOMAINS=localhost:8080
      # After clearing the oauth2-proxy cookie, also end the Entra session so
      # the next visit does not silent-SSO the user straight back in.
      - OAUTH2_PROXY_BACKEND_LOGOUT_URL=http://localhost:8444/6f89cf12-978b-4d23-ac18-9ef0c127cf87/oauth2/v2.0/logout?post_logout_redirect_uri=http%3A%2F%2Flocalhost%3A8080%2F
      - OAUTH2_PROXY_SKIP_JWT_BEARER_TOKENS=true
      - OAUTH2_PROXY_EXTRA_JWT_ISSUERS=http://localhost:8444/6f89cf12-978b-4d23-ac18-9ef0c127cf87/v2.0=api://dns-zone-manager
      - OAUTH2_PROXY_API_ROUTES=^/v1/
      - OAUTH2_PROXY_SKIP_AUTH_ROUTES=GET=^/(health|ready|metrics)$
      - OAUTH2_PROXY_BEARER_TOKEN_LOGIN_FALLBACK=false
    # Dark templates are copied into this volume by the TRAEFIK task (same
    # nested-docker constraint as BIND/LGTM: host-path binds resolve on the
    # Docker daemon host, not the workspace inside `dev`).
    volumes:
      - oauth2-templates:/templates:ro
    restart: unless-stopped

  # Traefik reverse proxy: /oauth2 -> oauth2-proxy, everything else -> API
  # with ForwardAuth. Shares the `dev` network namespace (see entra above).
  traefik:
    image: traefik:v3.5
    network_mode: "container:${COMPOSE_PROJECT_NAME:-dns-zone-manager-go_devcontainer}-dev-1"
    command:
      - --entrypoints.web.address=:8080
      - --entrypoints.traefik.address=:8081
      - --api.insecure=true
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --accesslog=true
      - --log.level=INFO
    configs:
      - source: traefik_dynamic
        target: /etc/traefik/dynamic.yml
    restart: unless-stopped

  # BIND DNS Server
  # Pin to the 9.20 STABLE branch (even minor = stable, odd minor = development).
  # 9.21 is the ISC development/unstable branch and its config parsing differs
  # between patch releases (e.g. max-ixfr-ratio), which breaks this config.
  # Keep this aligned with the CI image in tests/integration/bind_container.py.
  bind:
    image: internetsystemsconsortium/bind9:9.20
    platform: linux/amd64  # ISC only publishes amd64; runs under Rosetta on Apple Silicon
    hostname: bind
    environment:
      - TZ=UTC
    volumes:
      # named.conf and zones are injected via `docker cp` in the BIND task —
      # same reason as lgtm: bind mounts from inside a container use the Docker
      # daemon's (host's) path resolution, not the container's filesystem.
      # On-demand large zones generated by the perf harness (shared with `dev`)
      - perf-zones:/perf-zones
      - managed-zones:/managed-zones
    # Use tmpfs for zone data - automatically cleared on container stop/restart
    tmpfs:
      - /var/lib/bind:uid=100,gid=101
    entrypoint: /bin/sh
    command:
      - -c
      - |
        # Wait for named.conf and zones to be injected via `docker cp`.
        until [ -f /etc/bind/named.conf ] && [ -d /etc/bind/zones-source ] && [ "$(ls -A /etc/bind/zones-source 2>/dev/null)" ]; do
          echo "[bind entrypoint] waiting for config files..."
          sleep 1
        done
        set -e
        cp /etc/bind/zones-source/* /var/lib/bind/
        chmod 666 /var/lib/bind/*
        mkdir -p /perf-zones /managed-zones
        chmod 777 /perf-zones /managed-zones

        # Start with an empty also-notify so named can boot before the dev container.
        echo 'also-notify { };' > /var/lib/bind/also-notify.conf

        # Minimal rndc config for in-container control (127.0.0.1:953).
        cat > /var/lib/bind/rndc-internal.conf <<'EOF'
        key "rndc-key" {
            algorithm hmac-sha256;
            secret "xT7J2kLpN9qRvW4mY8sF1gH5bC3dE6aZ0iO7uP2wX4c=";
        };
        options {
            default-key "rndc-key";
            default-server 127.0.0.1;
            default-port 953;
        };
        EOF

        chown -R bind:bind /var/lib/bind

        # Background: resolve the dev service name, then enable NOTIFY to it.
        (
          target_host=dev
          i=0
          while [ "$$i" -lt 60 ]; do
            set -- $$(getent hosts "$$target_host" 2>/dev/null || true)
            if [ -n "$$1" ]; then
              echo "also-notify { $$1 port 15354; };" > /var/lib/bind/also-notify.conf
              chown bind:bind /var/lib/bind/also-notify.conf
              rndc -c /var/lib/bind/rndc-internal.conf reconfig 2>/dev/null || true
              echo "[entrypoint] NOTIFY target set to $$1"
              break
            fi
            i=$$((i + 1))
            sleep 2
          done
        ) &

        exec /usr/sbin/named -g -c /etc/bind/named.conf -u bind
    healthcheck:
      test: ["CMD-SHELL", "pgrep named > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - devnet

  # PostgreSQL - scheduled change and audit store for local development.
  # Data lives in tmpfs so it is cleared on container stop/restart, the same
  # way BIND's zone data is. That keeps development runs reproducible and means
  # every restart re-exercises creating the schema in an empty database.
  postgres:
    image: postgres:17
    hostname: postgres
    environment:
      - TZ=UTC
      - POSTGRES_USER=dns_zone_manager
      - POSTGRES_PASSWORD=devpassword
      - POSTGRES_DB=dns_zone_manager
      # tmpfs starts empty on every boot, so initdb has to run each time.
      - PGDATA=/var/lib/postgresql/data/pgdata
    tmpfs:
      - /var/lib/postgresql/data:uid=999,gid=999
    # Published so host GUI clients can connect; the dev container uses the
    # "postgres" service name on 5432.
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dns_zone_manager -d dns_zone_manager"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - devnet

  # Opt-in continuous churn against always-changing.example (DDNS + API).
  # Enable with: docker compose --profile churn up -d zone-churn
  zone-churn:
    profiles: ["churn"]
    build:
      context: ../examples/always-changing
    hostname: zone-churn
    environment:
      - TZ=UTC
      - ZONE=always-changing.example.
      - BIND_HOST=bind
      - BIND_PORT=15353
      - API_BASE=http://dev:8000
      - API_KEY=dev
      - INTERVAL_SEC=5
      - TSIG_NAME=dns-api-key
      - TSIG_SECRET=K8vC2mP9nQ4rT6wX1yB3fG5hJ7kL0mN2pR4sU6vW8xY=
      - TSIG_ALG=hmac-sha256
    depends_on:
      bind:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - devnet

  # Grafana LGTM (Loki + Grafana + Tempo + Prometheus/Mimir + OTel Collector).
  # Scrapes /metrics from the API in the `dev` container; receives OTLP logs on :4318.
  lgtm:
    image: grafana/otel-lgtm:0.5.0
    hostname: lgtm
    environment:
      - TZ=UTC
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/otel-lgtm/grafana/conf/provisioning/dashboards/custom/dns-zone-manager.json
    ports:
      - "3000:3000"   # Grafana UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      # Config files are injected via `docker cp` in the LGTM task so that
      # the task can run from inside the dev container (bind-mounting host
      # paths from inside a container via the Docker socket doesn't work on
      # Docker Desktop for Mac — the daemon resolves paths on the host, not
      # inside the dev container).
      - lgtm-data:/data
    networks:
      - devnet
    restart: unless-stopped

networks:
  # Explicit name so the network is always `dns_devnet` regardless of which
  # compose project name VS Code or a task uses. Without this, Docker prefixes
  # the name with the project name, which can differ between VS Code's host-side
  # startup invocation and tasks running inside the container — putting sibling
  # containers on different networks so they cannot reach each other by hostname.
  devnet:
    name: dns_devnet
    driver: bridge

volumes:
  lgtm-data:
  perf-zones:
  managed-zones:
  oauth2-templates:

# Inline Traefik file-provider config. Compose copies this into the Traefik
# container (same reason BIND/LGTM avoid host-path bind mounts from inside
# the dev container). ForwardAuth targets localhost because Traefik shares
# the `dev` network namespace with oauth2-proxy and the API process.
configs:
  traefik_dynamic:
    content: |
      http:
        routers:
          oauth2:
            rule: PathPrefix(`/oauth2`)
            entryPoints: [web]
            priority: 100
            service: oauth2-proxy
          app:
            rule: PathPrefix(`/`)
            entryPoints: [web]
            priority: 1
            middlewares: [oauth2-auth]
            service: backend
        services:
          oauth2-proxy:
            loadBalancer:
              servers:
                - url: http://127.0.0.1:4180
          backend:
            loadBalancer:
              servers:
                - url: http://127.0.0.1:8000
        middlewares:
          oauth2-auth:
            forwardAuth:
              address: http://127.0.0.1:4180/
              trustForwardHeader: true
              authResponseHeaders:
                - X-Auth-Request-User
                - X-Auth-Request-Email
                - X-Auth-Request-Preferred-Username
                - X-Auth-Request-Groups

