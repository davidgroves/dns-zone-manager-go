# DNS Zone Manager - Devcontainer Configuration
# ==============================================
# Use this configuration when running inside the devcontainer.
# BIND runs in a sibling container accessible at hostname 'bind'.
#
# Usage:
#   go run ./cmd/dns-zone-manager serve --config .devcontainer/config.devcontainer.yaml

# =============================================================================
# TSIG Keys (referenced by name from dns and notify sections)
# =============================================================================
tsig_keys:
  - name: dns-api-key
    secret: K8vC2mP9nQ4rT6wX1yB3fG5hJ7kL0mN2pR4sU6vW8xY=
    algorithm: hmac-sha256

# DNS Server - connects to BIND container.
# Uses the Compose service name "bind"; the API resolves it to the
# container's current IP at startup, so no static network/IP is required.
dns:
  server: bind
  port: 15353
  timeout: 10.0
  axfr_timeout: 60.0
  pool_size: 256
  update_tsig_key: dns-api-key

# Authentication is on in the devcontainer so the Traefik + oauth2-proxy +
# Entra-emulator front door (http://localhost:8080) can be exercised end to
# end. Direct access to :8000 accepts API keys; traffic through Traefik uses
# proxy_auth identity headers injected by oauth2-proxy (clients cannot spoof
# those headers through the proxy). Spoofing headers against :8000 directly
# is possible — that is intentional for local development only.
api_key:
  enabled: true
  header_name: X-API-Key
  keys:
    - name: dev
      secret: dev
    - name: alice
      secret: demo-api-key-12345

proxy_auth:
  enabled: true
  user_header: X-Auth-Request-Email
  name_header: X-Auth-Request-Preferred-Username
  # Front-channel IdP logout (clears Entra ee_session), then returns to
  # oauth2-proxy sign_out to clear the app cookie. Without this, logout only
  # clears oauth2-proxy and Entra silent-SSO logs the user straight back in.
  logout_url: http://localhost:8444/6f89cf12-978b-4d23-ac18-9ef0c127cf87/oauth2/v2.0/logout?client_id=c9c2fd4f-4c1e-44a3-9cd5-a1a1191fe9a3&post_logout_redirect_uri=http%3A%2F%2Flocalhost%3A8080%2Foauth2%2Fsign_out

# Cache Configuration
cache:
  enabled: true
  min_refresh_interval: 60
  max_refresh_interval: 86400
  serial_refresh_debounce: 2s

# Catalog Zone Configuration
catalog:
  enabled: true
  zone_name: catalog.example.
  poll_interval: 60
  notify_bind_address: 0.0.0.0
  notify_udp_port: 15355
  notify_tcp_port: 15355
  auto_load_zones: true
  remove_stale_zones: false

# Optional BIND rndc control for creating and deleting zones.
# BIND 9.20 (this stack) has no `initial-file`, so the API writes a seed zone
# file into a directory shared with named, then runs `rndc addzone`.
rndc:
  enabled: true
  host: bind
  port: 953
  algorithm: hmac-sha256
  secret: xT7J2kLpN9qRvW4mY8sF1gH5bC3dE6aZ0iO7uP2wX4c=
  zone_seed:
    mode: shared_dir
    local_dir: /managed-zones
    bind_dir: /managed-zones
  zone_defaults:
    primary_ns: ns1.example.
    admin_email: hostmaster.example.
    nameservers:
      - ns1.example.

# NOTIFY Listener Configuration (for zone change notifications from BIND).
# BIND's compose entrypoint points also-notify at this container on 15354.
notify:
  enabled: true
  bind_address: 0.0.0.0
  udp_port: 15354
  tcp_port: 15354
  prefer_ixfr: true
  require_tsig: false

# Persistence for scheduled changes and the audit log.
# PostgreSQL runs in a sibling container reachable at hostname 'postgres'. Its
# data is in tmpfs, so each devcontainer restart starts from an empty database
# and the schema is recreated automatically.
database:
  backend: postgres
  auto_migrate: true
  postgres:
    host: postgres
    port: 5432
    database: dns_zone_manager
    user: dns_zone_manager
    password: devpassword
    sslmode: disable
# To develop against SQLite instead, replace the block above with:
# database:
#   backend: sqlite
#   path: .tmp/scheduler.db

# Scheduled Changes (intent store; storage configured under 'database' above)
scheduler:
  enabled: true
  poll_interval: 5
  max_attempts: 3
  retry_backoff: 30
  lease_ttl: 120
  default_expiry_window: 3600

# Outbound change webhooks (Slack / Teams / generic).
# Manual DNS edits are autorecorded into the scheduler/audit store whenever the
# scheduler store is open (default); that does not require webhooks.enabled.
# Leave enabled false here so local dev does not retry unreachable targets.
# Add a target and set enabled: true to exercise real delivery.
webhooks:
  enabled: false
  base_url: http://localhost:8000
  # targets:
  #   - name: local-sink
  #     type: generic
  #     url: http://localhost:9099/hook
  #     allow_insecure: true
  #     auth:
  #       type: hmac
  #       secret: dev-signing-secret

# Logging - use text format for local development (human-readable)
logging:
  format: json
  level: INFO
  sample_rate: 1.0
  slow_threshold_ms: 1000
  # Ship logs to Loki via grafana/otel-lgtm (compose service `lgtm`)
  otlp_endpoint: http://lgtm:4318

# Enable debug mode
debug: true
