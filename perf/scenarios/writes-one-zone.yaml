name: writes-one-zone
description: >
  API write sweep against a single zone (test.local). Pair with writes-many-zones
  at the same rates to show BIND serializing per-zone updates.
zone: test.local
provision: false
require_zone: true
load:
  mode: api
  concurrency: 32
  pool_size: 2000
  readers: false
  steps:
    - { rps: 100, duration: 30, label: "one@100" }
    - { rps: 200, duration: 30, label: "one@200" }
    - { rps: 300, duration: 30, label: "one@300" }
    - { rps: 400, duration: 30, label: "one@400" }
    - { rps: 500, duration: 30, label: "one@500" }
    - { rps: 600, duration: 30, label: "one@600" }
    - { rps: 700, duration: 30, label: "one@700" }
    - { rps: 800, duration: 30, label: "one@800" }
    - { rps: 900, duration: 30, label: "one@900" }
    - { rps: 1000, duration: 30, label: "one@1000" }
notes:
  - Every change updates test.local. Compare with writes-many-zones.
