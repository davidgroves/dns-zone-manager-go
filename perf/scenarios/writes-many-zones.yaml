name: writes-many-zones
description: API write sweep round-robin across the 25 small catalog zones.
zone: alpha.test
provision: false
require_zone: true
load:
  mode: api
  concurrency: 32
  pool_size: 2000
  readers: false
  zones:
    - alpha.test
    - beta.test
    - gamma.test
    - delta.test
    - epsilon.test
    - zeta.test
    - eta.test
    - theta.test
    - iota.test
    - kappa.test
    - lambda.test
    - mu.test
    - nu.test
    - xi.test
    - omicron.test
    - pi.test
    - rho.test
    - sigma.test
    - tau.test
    - upsilon.test
    - phi.test
    - chi.test
    - psi.test
    - omega.test
    - final.test
  steps:
    - { rps: 100, duration: 30, label: "many@100" }
    - { rps: 200, duration: 30, label: "many@200" }
    - { rps: 300, duration: 30, label: "many@300" }
    - { rps: 400, duration: 30, label: "many@400" }
    - { rps: 500, duration: 30, label: "many@500" }
    - { rps: 600, duration: 30, label: "many@600" }
    - { rps: 700, duration: 30, label: "many@700" }
    - { rps: 800, duration: 30, label: "many@800" }
    - { rps: 900, duration: 30, label: "many@900" }
    - { rps: 1000, duration: 30, label: "many@1000" }
notes:
  - Same rates and record shape as writes-one-zone. Each change goes to the next zone.
