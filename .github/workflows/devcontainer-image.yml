# Build and publish the Dev Container image to GHCR.
#
# The devcontainer pulls this prebuilt image instead of building on the user's
# machine. That makes "clone -> Reopen in Container" fast and avoids building a
# complex image under Docker Desktop (apt GPG, VM clock, and BuildKit fs.read
# entitlement issues all stem from local builds). The image is multi-arch so it
# works on Apple Silicon (linux/arm64) and Intel/Linux (linux/amd64).
name: Dev Container image

on:
  push:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - '.github/workflows/devcontainer-image.yml'
  workflow_dispatch:

concurrency:
  group: devcontainer-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/dns-zone-manager-devcontainer

permissions:
  contents: read
  packages: write

jobs:
  # Build each architecture on a native runner (QEMU emulation of the Playwright
  # browser install is prohibitively slow), push by digest, then merge into one
  # manifest-list tag.
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devcontainer/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=devcontainer-${{ matrix.arch }}
          cache-to: type=gha,scope=devcontainer-${{ matrix.arch }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifest
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          tags="-t ${IMAGE}:latest -t ${IMAGE}:${GITHUB_SHA::12}"
          # shellcheck disable=SC2046
          docker buildx imagetools create $tags \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "${IMAGE}:latest"
