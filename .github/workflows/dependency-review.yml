# Review newly introduced dependencies on pull requests against the GitHub
# Advisory Database. Failures show on the PR checks; known CVEs also appear
# under Security → Dependabot alerts when that is enabled on the repo.
name: Dependency review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5.0.0
        with:
          comment-summary-in-pr: always
