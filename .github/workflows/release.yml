# On a v* tag: run CI, then publish binaries and container images via GoReleaser.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: CI
    uses: ./.github/workflows/ci.yml

  goreleaser:
    name: GoReleaser
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Build frontend into embed path
        run: |
          npm ci
          VER="${GITHUB_REF_NAME#v}"
          npm pkg set version="$VER"
          npx tsc && npx vite build
          # Version is already baked into the Vite build. Restore package.json
          # so GoReleaser's clean-tree check still passes.
          git checkout -- package.json
          rm -rf internal/ui/dist
          mkdir -p internal/ui/dist
          cp -a dist/. internal/ui/dist/
          # The real SPA replaces the committed placeholder. It has to stay on
          # disk for go:embed, but must not show up as a dirty tracked file.
          git update-index --skip-worktree internal/ui/dist/index.html
          dirty=$(git status --porcelain)
          if [ -n "$dirty" ]; then
            echo "git tree still dirty after frontend build:"
            printf '%s\n' "$dirty"
            exit 1
          fi

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
