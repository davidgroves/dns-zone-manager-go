# On a v* tag: run CI, scan local images, then publish binaries and GHCR.
name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  test:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  scan:
    name: Trivy
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/dns-zone-manager:${{ github.ref_name }}
      TRIVY_QUIET: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Build frontend into embed path
        run: |
          npm ci
          npx tsc && npx vite build
          rm -rf internal/ui/dist
          mkdir -p internal/ui/dist
          cp -a dist/. internal/ui/dist/
          git update-index --skip-worktree internal/ui/dist/index.html
          dirty=$(git status --porcelain)
          if [ -n "$dirty" ]; then
            echo "git tree still dirty after frontend build:"
            printf '%s\n' "$dirty"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build images without publishing
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy amd64
        id: trivy-amd64
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: ${{ env.IMAGE }}-amd64
          scan-type: image
          format: sarif
          output: trivy-amd64.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'
          hide-progress: true

      - name: Trivy arm64
        id: trivy-arm64
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: ${{ env.IMAGE }}-arm64
          scan-type: image
          format: sarif
          output: trivy-arm64.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'
          hide-progress: true

      - name: Upload Trivy SARIF (amd64)
        if: always() && hashFiles('trivy-amd64.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-amd64.sarif
          category: trivy-amd64

      - name: Upload Trivy SARIF (arm64)
        if: always() && hashFiles('trivy-arm64.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-arm64.sarif
          category: trivy-arm64

      - name: Fail on HIGH or CRITICAL
        if: always()
        run: |
          fail=0
          if [ "${{ steps.trivy-amd64.outcome }}" != "success" ]; then
            echo "amd64 image scan did not pass"
            fail=1
          fi
          if [ "${{ steps.trivy-arm64.outcome }}" != "success" ]; then
            echo "arm64 image scan did not pass"
            fail=1
          fi
          exit "$fail"

  goreleaser:
    name: GoReleaser
    needs: [test, scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Build frontend into embed path
        run: |
          npm ci
          npx tsc && npx vite build
          rm -rf internal/ui/dist
          mkdir -p internal/ui/dist
          cp -a dist/. internal/ui/dist/
          git update-index --skip-worktree internal/ui/dist/index.html
          dirty=$(git status --porcelain)
          if [ -n "$dirty" ]; then
            echo "git tree still dirty after frontend build:"
            printf '%s\n' "$dirty"
            exit 1
          fi

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
