# golangci-lint v2 config (golangci-lint >= 2.x).
# Migrated from the v1 file that no longer loaded under the image's linter.
version: "2"

run:
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - durationcheck
    - errorlint
    - misspell
    - nilerr
    - revive
    - unconvert
  settings:
    errcheck:
      check-type-assertions: false
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
    rules:
      # Tests often ignore Close/err for brevity.
      - path: _test\.go
        linters: [errcheck]
      # dns-cli's HTTP helper reads and closes the body before returning.
      - path: cmd/dns-cli/
        linters: [bodyclose]
      # bun.In still works; migrate to bun.List in a dedicated change.
      - text: "bun.In is deprecated"
        linters: [staticcheck]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
