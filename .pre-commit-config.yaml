# Pre-commit hooks for the Go DNS Zone Manager.
# Installed in the devcontainer via: pre-commit install
repos:
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -w -s
        language: system
        types: [go]

      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        pass_filenames: false
        types: [go]

      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run ./...
        language: system
        pass_filenames: false
        types: [go]

      - id: tsc
        name: typescript type check
        entry: npm run typecheck
        language: system
        types_or: [ts, tsx]
        files: ^(frontend/|src/|vite\.config\.|vitest\.config\.)
        pass_filenames: false
